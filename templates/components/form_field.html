<div class="form-field {% if wide %}field-wide{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="required">*</span>{% else %} <span class="optional">{{ optional_label|default:'facultatif' }}</span>{% endif %}</label>{{ field }}{% if field.help_text %}<small class="field-help">{{ field.help_text }}</small>{% endif %}{% if field.errors %}<div class="field-errors" id="error_{{ field.name }}">{{ field.errors }}</div>{% endif %}</div>
